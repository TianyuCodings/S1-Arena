# Deploys the leaderboard website (site/) to GitHub Pages on every push to main.
# Pages is enabled with Source: GitHub Actions (Settings > Pages); the site is public at
# https://tianyucodings.github.io/S1-Arena/ even while the repository is private.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Rebuild from leaderboard/results.json so the page always matches the committed numbers.
      - run: python scripts/build_site.py --out _site/index.html
      - run: cp -R site/media _site/media  # the closed-loop video and its poster (committed; not rebuilt here)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
