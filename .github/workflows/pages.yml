# Deploys the leaderboard website (site/) to GitHub Pages on every push to main.
# GitHub Pages works once the repository is public (or on a paid plan). Enable it once under
# Settings > Pages > Build and deployment > Source: GitHub Actions.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ !github.event.repository.private }}  # skipped while the repository is private
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Rebuild from leaderboard/results.json so the page always matches the committed numbers.
      - run: python scripts/build_site.py --out _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
